version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=${PORT}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - kong

  kong:
    image: supabase/kong:3.9.1
    ports:
      - "${KONG_PORT}:8000"
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_ACCESS=/etc/kong/kong.yml
      - KONG_LOG_LEVEL=error
    volumes:
      - ./supabase/kong.yml:/etc/kong/kong.yml

  auth:
    image: supabase/gotrue:v2.158.1
    ports:
      - "${AUTH_PORT}:9999"
    environment:
      - API_EXTERNAL_URL=http://kong:8000
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=${DATABASE_URL}
      - GOTRUE_DB_Schemas=auth,storage
      - GOTRUE_SITE_URL=http://localhost:${PORT}
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=false
      - GOTRUE_MAILER_AUTOCONFIRM=true
      - GOTRUE_SMS_AUTOCONFIRM=true
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_JWT_ADMIN_ROLES=admin
      - GOTRUE_JWT_AUD=authenticated
    depends_on:
      - kong

  rest:
    image: postgrest/postgrest:v12.2.3
    ports:
      - "${REST_PORT}:3000"
    environment:
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_DB_SCHEMAS=public,storage,graphql_public
      - PGRST_DB_URI=${DATABASE_URL}
      - PGRST_JWT_SECRET=${JWT_SECRET}
    depends_on:
      - kong

  storage:
    image: supabase/storage-api:v1.12.3
    ports:
      - "${STORAGE_PORT}:8000"
    environment:
      - ANON_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - POSTREST_URL=http://rest:3000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - rest
